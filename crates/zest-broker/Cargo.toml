[package]
name = "zest-broker"
version = "0.1.0"
edition = "2021"
description = "Zest broker: tool discovery, command planning, process isolation, job queue."
publish = false

[dependencies]
zest-core = { path = "../zest-core" }
crossbeam-channel = "0.5"
thiserror = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.10"
serde_json = "1"
