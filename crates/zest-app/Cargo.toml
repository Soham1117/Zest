[package]
name = "zest-app"
version = "0.1.0"
edition = "2021"
description = "Zest: radial drag-and-drop file converter (tray app and CLI)."
publish = false
build = "build.rs"

[[bin]]
name = "zest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zest-core = { path = "../zest-core" }
zest-broker = { path = "../zest-broker" }
zest-input = { path = "../zest-input" }
zest-overlay = { path = "../zest-overlay" }
zest-panels = { path = "../zest-panels" }
zest-shell = { path = "../zest-shell" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
