[package]
name = "zest-explorer-command"
version = "0.1.0"
edition = "2021"
description = "Windows 11 top-level context menu entry (IExplorerCommand in-proc COM server)."

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"
